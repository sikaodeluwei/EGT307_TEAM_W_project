apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-inference
  template:
    metadata:
      labels:
        app: ai-inference
    spec:
      containers:
        - name: ai-inference
          image: autocare-ai-inference:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001

          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: ai-inference-service
spec:
  type: ClusterIP
  selector:
    app: ai-inference
  ports:
    - name: http
      port: 8001
      targetPort: 8001
